<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Video Translator</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      color: #ff1744;
    }

    .box {
      background: #18181f;
      padding: 25px;
      border-radius: 15px;
      margin-top: 25px;
    }

    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      background: #25252d;
      color: white;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    select {
      background: #25252d;
      color: white;
    }

    button {
      background: #ff1744;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #25252d;
      border-radius: 10px;
      min-height: 80px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎬 Movie Recap Translator</h1>

  <div class="box">

    <h3>Movie Recap စာသား</h3>

    <textarea id="text">Hello, this is a movie dialogue.</textarea>

    <select id="language">
      <option value="Burmese">🇲🇲 မြန်မာ</option>
      <option value="Thai">🇹🇭 ထိုင်း</option>
      <option value="English">🇬🇧 English</option>
    </select>

    <button onclick="startTranslate()">
      🚀 Gemini Translate
    </button>

    <div id="status">
      ဘာသာပြန်စာ ဒီမှာပေါ်မယ်...
    </div>

  </div>

</div>

<script>

async function startTranslate() {

  const text =
    document.getElementById("text").value;

  const language =
    document.getElementById("language").value;

  const status =
    document.getElementById("status");

  if (!text.trim()) {
    status.innerText =
      "⚠️ စာသားထည့်ပါ";
    return;
  }

  status.innerText =
    "⏳ Gemini ဘာသာပြန်နေပါတယ်...";

  try {

    const response = await fetch(
      "/api/translate",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          text: text,
          targetLanguage: language
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Translation failed"
      );
    }

    status.innerText =
      "✅ " + data.translated;

  } catch (error) {

    status.innerText =
      "❌ Error: " + error.message;

  }
}

</script>

</body>
</html>
