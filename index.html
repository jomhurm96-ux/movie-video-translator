<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Recap Translator</title>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 700px;
      margin: 30px auto;
      padding: 25px;
      background: #18181f;
      border-radius: 15px;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 16px;
    }

    input,
    select {
      background: #25252d;
      color: white;
      border: 1px solid #444;
    }

    button {
      border: none;
      background: #ff1744;
      color: white;
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #25252d;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    video {
      width: 100%;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>

<body>

  <h1>🎬 Movie Recap Translator</h1>

  <div class="box">

    <input
      type="file"
      id="videoFile"
      accept="video/*"
    >

    <video id="preview" controls></video>

    <select id="language">
      <option value="Burmese">🇲🇲 မြန်မာ</option>
      <option value="Thai">🇹🇭 ထိုင်း</option>
      <option value="English">🇬🇧 English</option>
    </select>

    <button id="uploadButton">
      🚀 Upload Video
    </button>

    <div id="status">
      Video ရွေးပါ
    </div>

  </div>

  <script>

    const videoFile =
      document.getElementById("videoFile");

    const preview =
      document.getElementById("preview");

    const button =
      document.getElementById("uploadButton");

    const status =
      document.getElementById("status");


    videoFile.onchange = function () {

      const file =
        videoFile.files[0];

      if (!file) return;

      preview.src =
        URL.createObjectURL(file);

      preview.style.display =
        "block";

      status.innerText =
        "✅ Video ရွေးပြီးပါပြီ\n" +
        file.name;

    };


    button.onclick = function () {

      const file =
        videoFile.files[0];

      if (!file) {

        status.innerText =
          "⚠️ Video အရင်ရွေးပါ";

        return;

      }

      status.innerText =
        "✅ ခလုတ်အလုပ်လုပ်နေပါပြီ!\n\n" +
        "Video: " +
        file.name;

    };

  </script>

</body>
</html>
