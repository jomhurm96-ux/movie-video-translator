<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Recap Translator</title>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      max-width: 700px;
      margin: auto;
      padding: 25px;
      background: #18181f;
      border-radius: 15px;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #ff1744;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    video {
      width: 100%;
      margin-top: 20px;
      display: none;
      border-radius: 8px;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #25252d;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #111116;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.7;
      display: none;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎬 Movie Recap Translator</h1>

  <input
    type="file"
    id="videoFile"
    accept="video/*"
  >

  <video id="preview" controls></video>

  <select id="language">
    <option value="Burmese">🇲🇲 မြန်မာ</option>
    <option value="Thai">🇹🇭 ထိုင်း</option>
    <option value="English">🇬🇧 English</option>
  </select>

  <button id="uploadButton" type="button">
    🚀 Upload Video
  </button>

  <div id="status">
    Video ရွေးပါ
  </div>

  <div id="result"></div>

</div>

<script>

const videoFile = document.getElementById("videoFile");
const preview = document.getElementById("preview");
const button = document.getElementById("uploadButton");
const status = document.getElementById("status");
const resultBox = document.getElementById("result");


// ============================
// VIDEO SELECT
// ============================

videoFile.addEventListener("change", function () {

  const file = videoFile.files[0];

  if (!file) return;

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  resultBox.style.display = "none";

  status.innerText =
    "✅ Video ရွေးပြီးပါပြီ\n\n" +
    "📁 " + file.name + "\n" +
    "📦 " + (file.size / 1024 / 1024).toFixed(2) + " MB";

});


// ============================
// UPLOAD
// ============================

button.addEventListener("click", async function () {

  const file = videoFile.files[0];

  if (!file) {

    status.innerText =
      "⚠️ Video အရင်ရွေးပါ";

    return;
  }

  const targetLanguage =
    document.getElementById("language").value;


  button.disabled = true;

  resultBox.style.display = "none";


  try {

    // STEP 1
    status.innerText =
      "⏳ Video upload လုပ်နေပါတယ်...\n\n" +
      "📁 " + file.name;


    const uploadResponse =
      await fetch("/api/video", {

        method: "POST",

        headers: {
          "Content-Type":
            file.type || "video/mp4"
        },

        body: file

      });


    const uploadData =
      await uploadResponse.json();


    if (!uploadResponse.ok) {

      throw new Error(
        uploadData.error ||
        "Video upload မအောင်မြင်ပါ"
      );

    }


    const fileUri =
      uploadData.url;


    // STEP 2
    status.innerText =
      "✅ Upload ပြီးပါပြီ\n\n" +
      "⏳ ဘာသာပြန်နေပါတယ်...\n" +
      "🌐 " + targetLanguage;


    const translateResponse =
      await fetch("/api/translate", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          fileUri: fileUri,

          mimeType:
            file.type || "video/mp4",

          targetLanguage:
            targetLanguage

        })

      });


    const translateData =
      await translateResponse.json();


    if (!translateResponse.ok) {

      throw new Error(
        translateData.error ||
        "ဘာသာပြန်မအောင်မြင်ပါ"
      );

    }


    // STEP 3
    status.innerText =
      "🎉 ပြီးပါပြီ!";


    resultBox.innerText =
      translateData.translated ||
      "ဘာသာပြန်စာ မရရှိပါ";

    resultBox.style.display =
      "block";


  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ Error\n\n" +
      error.message;

  }


  button.disabled = false;

});

</script>

</body>
</html>
