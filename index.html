<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Recap Translator</title>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #ff1744;
    }

    .box {
      background: #18181f;
      padding: 25px;
      border-radius: 15px;
      margin-top: 25px;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 16px;
    }

    input,
    select {
      background: #25252d;
      color: white;
      border: 1px solid #444;
    }

    button {
      border: none;
      background: #ff1744;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      display: none;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #25252d;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎬 Movie Recap Translator</h1>

  <div class="box">

    <h3>🎥 Video ထည့်ပါ</h3>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
    >

    <video id="preview" controls></video>

    <h3>🌐 ဘာသာစကား</h3>

    <select id="language">
      <option value="Burmese">🇲🇲 မြန်မာ</option>
      <option value="Thai">🇹🇭 ထိုင်း</option>
      <option value="English">🇬🇧 English</option>
    </select>

    <button id="uploadButton" type="button">
      🚀 Upload Video
    </button>

    <div id="status">
      Video ရွေးပြီး Upload Video နှိပ်ပါ
    </div>

  </div>

</div>

<script type="module">

import { upload } from "@vercel/blob/client";

const videoFile =
  document.getElementById("videoFile");

const preview =
  document.getElementById("preview");

const button =
  document.getElementById("uploadButton");

const status =
  document.getElementById("status");


videoFile.addEventListener("change", () => {

  const file =
    videoFile.files[0];

  if (!file) return;

  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

  status.innerText =
    "✅ Video ရွေးပြီးပါပြီ\n" +
    file.name + "\n" +
    Math.round(file.size / 1024 / 1024) +
    " MB";

});


button.addEventListener("click", async () => {

  const file =
    videoFile.files[0];

  if (!file) {

    status.innerText =
      "⚠️ Video အရင်ရွေးပါ";

    return;
  }

  button.disabled = true;

  status.innerText =
    "⏳ Video Upload လုပ်နေပါတယ်...";

  try {

    const blob = await upload(
      file.name,
      file,
      {
        access: "public",
        handleUploadUrl: "/api/video"
      }
    );

    status.innerText =
      "✅ Upload အောင်မြင်ပါပြီ!\n\n" +
      blob.url;

  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ Upload Error:\n" +
      error.message;

  } finally {

    button.disabled = false;

  }

});

</script>

</body>
</html>
