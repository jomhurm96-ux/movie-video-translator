<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Recap Translator</title>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      max-width: 700px;
      margin: auto;
      padding: 25px;
      background: #18181f;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      color: #ff1744;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 16px;
    }

    input,
    select {
      background: #25252d;
      color: white;
      border: 1px solid #444;
    }

    button {
      background: #ff1744;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    video {
      width: 100%;
      margin-top: 20px;
      display: none;
      border-radius: 10px;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #25252d;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎬 Movie Recap Translator</h1>

  <input
    type="file"
    id="videoFile"
    accept="video/*"
  >

  <video id="preview" controls></video>

  <select id="language">

    <option value="Burmese">
      🇲🇲 မြန်မာ
    </option>

    <option value="Thai">
      🇹🇭 ထိုင်း
    </option>

    <option value="English">
      🇬🇧 English
    </option>

  </select>

  <button id="uploadButton" type="button">
    🚀 Upload Video
  </button>

  <div id="status">
    Video ရွေးပါ
  </div>

</div>


<script>

const videoFile =
  document.getElementById("videoFile");

const preview =
  document.getElementById("preview");

const button =
  document.getElementById("uploadButton");

const status =
  document.getElementById("status");


videoFile.addEventListener(
  "change",
  function () {

    const file =
      videoFile.files[0];

    if (!file) return;

    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      "block";

    status.innerText =
      "✅ Video ရွေးပြီးပါပြီ\n\n" +
      file.name;

  }
);


button.addEventListener(
  "click",
  function () {

    const file =
      videoFile.files[0];

    if (!file) {

      status.innerText =
        "⚠️ Video အရင်ရွေးပါ";

      return;

    }

    status.innerText =
      "✅ Upload ခလုတ် အလုပ်လုပ်နေပါပြီ!\n\n" +
      "Video: " +
      file.name;

  }
);

</script>

</body>
</html>
