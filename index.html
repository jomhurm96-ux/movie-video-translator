<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Recap Translator</title>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      max-width: 700px;
      margin: auto;
      padding: 25px;
      background: #18181f;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      color: #ff1744;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 16px;
    }

    input,
    select {
      background: #25252d;
      color: white;
      border: 1px solid #444;
    }

    button {
      background: #ff1744;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #555;
    }

    video {
      width: 100%;
      margin-top: 20px;
      display: none;
      border-radius: 10px;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #25252d;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #timer {
      display: none;
      margin-top: 15px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #ff1744;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎬 Movie Recap Translator</h1>

  <input
    type="file"
    id="videoFile"
    accept="video/*"
  >

  <video
    id="preview"
    controls>
  </video>

  <select id="language">

    <option value="Burmese">
      🇲🇲 မြန်မာ
    </option>

    <option value="Thai">
      🇹🇭 ထိုင်း
    </option>

    <option value="English">
      🇬🇧 English
    </option>

  </select>

  <button
    id="uploadButton"
    type="button">
    🚀 Upload Video
  </button>

  <div id="timer">
    00:00
  </div>

  <div id="status">
    Video ရွေးပါ
  </div>

</div>


<script>

const videoFile =
  document.getElementById("videoFile");

const preview =
  document.getElementById("preview");

const button =
  document.getElementById("uploadButton");

const status =
  document.getElementById("status");

const timer =
  document.getElementById("timer");


let seconds = 0;

let timerInterval = null;


function formatTime(totalSeconds) {

  const minutes =
    Math.floor(totalSeconds / 60);

  const secs =
    totalSeconds % 60;

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );

}


videoFile.addEventListener(
  "change",
  function () {

    const file =
      videoFile.files[0];

    if (!file) {
      return;
    }

    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      "block";

    status.innerText =
      "✅ Video ရွေးပြီးပါပြီ\n\n" +
      "📁 " +
      file.name + "\n" +
      "📦 " +
      Math.round(
        file.size / 1024 / 1024
      ) +
      " MB";

  }
);


button.addEventListener(
  "click",
  function () {

    const file =
      videoFile.files[0];

    if (!file) {

      status.innerText =
        "⚠️ Video အရင်ရွေးပါ";

      return;
    }


    button.disabled = true;


    seconds = 0;

    timer.innerText =
      "00:00";

    timer.style.display =
      "block";


    status.innerText =
      "⏳ Video ကို စစ်နေပါတယ်...\n\n" +
      "📁 " +
      file.name;


    clearInterval(timerInterval);


    timerInterval =
      setInterval(
        function () {

          seconds++;

          timer.innerText =
            formatTime(seconds);

          status.innerText =
            "⏳ video စလုပ်ပီ...\n\n" +
            "ကြာချိန်: " +
            formatTime(seconds) +
            "\n\n" +
            "📁 " +
            file.name;

        },
        1000
      );


  }
);

</script>

</body>
</html>
