<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Video Translator</title>

<style>
body {
  margin: 0;
  background: #0b0b0f;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 30px 20px;
}

h1 {
  text-align: center;
  color: #ff1744;
}

.box {
  background: #18181f;
  padding: 25px;
  border-radius: 15px;
  margin-top: 25px;
}

input,
select,
button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

input,
select {
  background: #25252d;
  color: white;
}

button {
  background: #ff1744;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

video {
  width: 100%;
  margin-top: 20px;
  border-radius: 10px;
  display: none;
}

#status {
  margin-top: 20px;
  padding: 15px;
  background: #25252d;
  border-radius: 10px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Movie Video Translator</h1>

<div class="box">

<h3>🎥 Video ထည့်ပါ</h3>

<input
  type="file"
  id="videoFile"
  accept="video/*"
>

<video
  id="preview"
  controls>
</video>

<h3>🌐 ဘာသာစကားရွေးပါ</h3>

<select id="language">

<option value="Burmese">
🇲🇲 မြန်မာ
</option>

<option value="Thai">
🇹🇭 ထိုင်း
</option>

<option value="English">
🇬🇧 English
</option>

</select>

<button onclick="translateVideo()">
🚀 Translate Video
</button>

<div id="status">
Video ရွေးပြီး Translate နှိပ်ပါ
</div>

</div>

</div>

<script>

const videoFile =
document.getElementById("videoFile");

const preview =
document.getElementById("preview");

const status =
document.getElementById("status");

videoFile.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  preview.src =
    URL.createObjectURL(file);

  preview.style.display = "block";

  status.innerText =
    "✅ Video ရွေးပြီးပါပြီ";

});


async function translateVideo() {

  const file =
    videoFile.files[0];

  const language =
    document.getElementById("language").value;

  if (!file) {

    status.innerText =
      "⚠️ Video အရင်ရွေးပါ";

    return;
  }

  if (file.size > 20 * 1024 * 1024) {

    status.innerText =
      "⚠️ အခုစမ်းသပ် version မှာ Video 20MB အောက်ပဲ ထည့်ပါ";

    return;
  }

  status.innerText =
    "⏳ Gemini က Video ကိုဖတ်နေပါတယ်...";

  try {

    const reader =
      new FileReader();

    reader.onload = async function () {

      const base64 =
        reader.result.split(",")[1];

      const response =
        await fetch("/api/video", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            videoBase64: base64,

            mimeType: file.type,

            targetLanguage: language

          })

        });

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.error || "Video translation failed"
        );

      }

      status.innerText =
        "✅ ဘာသာပြန်ပြီးပါပြီ\n\n" +
        data.translated;

    };

    reader.readAsDataURL(file);

  } catch (error) {

    status.innerText =
      "❌ Error: " + error.message;

  }

}

</script>

</body>
</html>
